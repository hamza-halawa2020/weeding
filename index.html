  <style>
    :root {
      --gold: #b8972a;
      --rose: #9b7ec8;
      --cream: #f5f0fa;
      --dark: #3b2d6e
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: #f0ebf8;
      color: #2d1f5e;
      font-family: Cairo, sans-serif;
      overflow-x: hidden
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 30%, #c8b4e844, transparent 65%);
      z-index: -1
    }

    button,
    a {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .stars,
    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 6
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #9b7ec8;
      border-radius: 50%;
      animation: twinkle 3s infinite alternate
    }

    .petal {
      position: absolute;
      top: -50px;
      font-size: 18px;
      opacity: .7;
      animation: fall linear forwards
    }

    @keyframes twinkle {
      to {
        opacity: .15;
        transform: scale(.4)
      }
    }

    @keyframes fall {
      to {
        transform: translate(90px, 110vh) rotate(560deg);
        opacity: 0
      }
    }

    .opening {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 45%, #402536, #130e19 72%);
      z-index: 20;
      transition: opacity 1s, visibility 1s
    }

    .opening.hide {
      opacity: 0;
      visibility: hidden
    }

    .intro {
      text-align: center;
      padding: 22px;
      width: 100%
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: 4px;
      font-size: 12px
    }

    .intro h1 {
      font: 700 clamp(32px, 7vw, 62px) Amiri, serif;
      margin: 16px 0 30px
    }

    .envelope {
      position: relative;
      width: min(310px, 78vw);
      height: 205px;
      margin: 0 auto 34px;
      filter: drop-shadow(0 20px 35px #0008);
      transition: transform .5s
    }

    .envelope:hover {
      transform: translateY(-9px) rotate(-2deg)
    }

    .env-back {
      position: absolute;
      inset: 0;
      background: #b97e89;
      border-radius: 8px
    }

    .env-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #f0b8bb, #b8798d);
      clip-path: polygon(0 0, 50% 57%, 100% 0, 100% 100%, 0 100%);
      border-radius: 8px
    }

    .env-flap {
      position: absolute;
      inset: 0;
      background: #f3c4c1;
      clip-path: polygon(0 0, 100% 0, 50% 61%);
      transform-origin: top;
      transition: transform 1s;
      z-index: 2
    }

    .seal {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #8f3e58;
      color: #f7d6a5;
      font: 30px Amiri;
      box-shadow: 0 4px 12px #0005;
      z-index: 3
    }

    .envelope.open .env-flap {
      transform: rotateX(180deg)
    }

    .envelope.open .seal {
      opacity: 0;
      transition: opacity .25s
    }

    .open-btn,
    .action {
      border: 1px solid #e8c99588;
      background: linear-gradient(120deg, #e7c38e, #f7e2b9);
      color: #362232;
      padding: 12px 30px;
      border-radius: 40px;
      font-weight: 700;
      box-shadow: 0 8px 28px #d3a47733;
      transition: transform .3s, box-shadow .3s
    }

    .open-btn:hover,
    .action:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px #d3a47766
    }

    .hint {
      opacity: .65;
      font-size: 12px;
      margin-top: 16px
    }

    .site {
      opacity: 0;
      transition: opacity 1.3s
    }

    .site.visible {
      opacity: 1
    }

    .hero {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 65px 20px;
      position: relative
    }

    .hero:before,
    .hero:after {
      content: '❦';
      position: absolute;
      font-size: 100px;
      color: #c89a7c2b
    }

    .hero:before {
      top: 12px;
      right: 3%
    }

    .hero:after {
      bottom: 15px;
      left: 3%;
      transform: rotate(180deg)
    }

    .frame {
      width: min(720px, 100%);
      padding: 65px 25px;
      border: 1px solid #9b7ec86b;
      border-radius: 220px 220px 22px 22px;
      background: linear-gradient(160deg, #ddd0f088, #f0ebf8aa);
      box-shadow: 0 0 0 10px #9b7ec80d, 0 30px 80px #9b7ec820;
      position: relative;
      overflow: hidden
    }

    .frame:before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid #9b7ec83c;
      border-radius: 210px 210px 15px 15px;
      pointer-events: none
    }

    .ornament {
      font-size: 45px;
      color: var(--gold);
      animation: float 4s ease-in-out infinite
    }

    @keyframes float {
      50% {
        transform: translateY(-10px)
      }
    }

    .sub {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 2px
    }

    .names {
      font: 700 clamp(57px, 12vw, 110px) Amiri, serif;
      line-height: 1.25;
      margin: 16px 0;
      color: #2d1f5e;
      text-shadow: 0 4px 24px #9b7ec84d
    }

    .amp {
      display: block;
      font-size: 38px;
      color: var(--rose);
      line-height: 1
    }

    .line {
      height: 1px;
      width: 140px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 24px auto
    }

    .message {
      font: clamp(19px, 3vw, 25px) Amiri, serif;
      line-height: 2;
      color: #3b2d6e
    }

    .scroll {
      display: inline-block;
      margin-top: 26px;
      color: var(--gold);
      animation: bob 1.8s infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(8px)
      }
    }

    section.details {
      padding: 80px 20px;
      text-align: center;
      max-width: 950px;
      margin: auto
    }

    .section-title {
      font: 700 clamp(34px, 6vw, 52px) Amiri;
      margin: 0 0 12px;
      color: var(--gold)
    }

    .description {
      opacity: .8;
      line-height: 2
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 40px 0
    }

    .card {
      padding: 32px 12px;
      border: 1px solid #9b7ec844;
      background: #9b7ec808;
      border-radius: 22px;
      backdrop-filter: blur(6px);
      transition: transform .3s
    }

    .card:hover {
      transform: translateY(-8px)
    }

    .card .ico {
      font-size: 32px
    }

    .card h3 {
      color: var(--gold);
      margin: 10px 0
    }

    .card p {
      margin: 0;
      line-height: 1.9
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 32px 0
    }

    .timebox {
      width: 90px;
      padding: 15px 8px;
      border-radius: 16px;
      background: #9b7ec815;
      border: 1px solid #9b7ec855
    }

    .timebox strong {
      display: block;
      font-size: 29px;
      color: var(--gold)
    }

    .timebox span {
      font-size: 12px
    }

    .footer {
      text-align: center;
      padding: 60px 20px 95px;
      background: #9b7ec80d
    }

    .footer h2 {
      font: 38px Amiri;
      color: var(--gold)
    }

    .footer p {
      font: 22px Amiri
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px
    }

    .action.secondary {
      background: transparent;
      color: var(--gold)
    }

    .music {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 10;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      background: #ede0f8;
      color: var(--gold);
      font-size: 23px;
      box-shadow: 0 6px 20px #9b7ec830
    }

    .music.playing {
      animation: pulse 2s infinite
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 12px #e8c99512
      }
    }

    .reveal {
      opacity: 0;
      transform: translateY(35px);
      transition: opacity .9s, transform .9s
    }

    .reveal.show {
      opacity: 1;
      transform: none
    }

    @media(max-width:620px) {
      .cards {
        grid-template-columns: 1fr
      }

      .hero {

    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }

    .envelope {

    }

    .envelope>* {

    .opening .env-flap {

<body>
  <div class="stars" id="stars"></div>
  <div class="petals" id="petals"></div>
  <div class="opening" id="opening">
    <div class="intro">
      <div class="eyebrow" id="coverEyebrow"></div>
      <h1 id="coverTitle"><span class="cover-message" id="coverSubtitle"></span></h1>
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="افتح الدعوة" style="cursor:pointer">
        <div class="env-back"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal">♥</div>
      </div><button class="open-btn" id="openBtn"></button>
    </div>
  </div>
  <main class="site" id="site">
    <article class="frame invitation-card" id="invitationCard">
      <div class="ornament">❦</div>
      <p class="sub" id="cardSub"></p>
      <div class="names"><span id="groomName"></span><span class="amp">♥</span><span id="brideName"></span></div>
      <div class="line"></div>
      <p class="message" id="cardMessage"></p>
      <section class="details">
        <h2 class="section-title reveal" id="detailsTitle"></h2>
        <p class="description reveal" id="detailsSubtitle"></p>
        <div class="cards">
          <div class="card reveal">
            <div class="ico">📅</div>
            <h3>التاريخ</h3>
            <p id="dateText"></p>
          </div>
          <div class="card reveal">
            <div class="ico">🕗</div>
            <h3>الموعد</h3>
            <p id="timeText"></p>
          </div>
          <div class="card reveal">
            <div class="ico">📍</div>
            <h3>المكان</h3>
            <p id="venueText"></p>
          </div>
        </div>
        <h2 class="section-title reveal" id="countdownTitle"></h2>
        <div class="countdown reveal" id="countdown">
          <div class="timebox"><strong id="days">00</strong><span>يوم</span></div>
          <div class="timebox"><strong id="hours">00</strong><span>ساعة</span></div>
          <div class="timebox"><strong id="minutes">00</strong><span>دقيقة</span></div>
          <div class="timebox"><strong id="seconds">00</strong><span>ثانية</span></div>
        </div>
        <div class="actions reveal"><a class="action" id="mapLink" href="#" target="_blank" rel="noopener"></a></div>
      </section>
      <footer class="footer">
        <h2 class="reveal" id="footerTitle"></h2>
        <p class="reveal" id="footerSub"></p>
        <div class="actions reveal"><button class="action" id="shareBtn"></button></div>
      </footer>
    </article>
  </main>
  <button class="music" id="musicBtn" title="تشغيل أو إيقاف الموسيقى" aria-label="تشغيل أو إيقاف الموسيقى"
    hidden>♫</button>
  <audio id="music" loop preload="auto">
    <source src="wedding-music.mp3" type="audio/mpeg">
  </audio>
  <script>
    const $ = id => document.getElementById(id);

    // ── تحميل config.json وتطبيق كل القيم
    fetch('config.json')
      .then(r => r.json())
      .then(c => {
        // عنوان الصفحة
        document.title = c.pageTitle || '';

        // الشاشة الافتتاحية
        $('coverEyebrow').textContent = c.coverEyebrow || '';
        $('coverSubtitle').textContent = c.coverSubtitle || '';
        const h1 = $('coverTitle');
        h1.childNodes[0]
          ? h1.insertBefore(document.createTextNode(c.groom + ' ♥ ' + c.bride + ' '), h1.firstChild)
          : h1.prepend(c.groom + ' ♥ ' + c.bride + ' ');
        $('openBtn').textContent = c.coverButton || '';
        $('envelope').setAttribute('aria-label', 'افتح دعوة ' + c.groom + ' ♥ ' + c.bride);

        // البطاقة الداخلية
        $('groomName').textContent = c.groom || '';
        $('brideName').textContent = c.bride || '';
        $('cardSub').textContent = c.cardSub || '';
        $('cardMessage').innerHTML = (c.cardMessage || '').replace(/\n/g, '<br>');

        // التفاصيل
        $('detailsTitle').textContent = c.detailsTitle || '';
        $('detailsSubtitle').textContent = c.detailsSubtitle || '';
        $('dateText').textContent = c.dateLabel || '';
        $('timeText').textContent = c.timeLabel || '';
        $('venueText').textContent = c.venue || '';
        $('countdownTitle').textContent = c.countdownTitle || '';

        // الأزرار والروابط
        $('mapLink').textContent = c.mapBtn || '📍 الموقع';
        $('mapLink').href = c.mapUrl || '#';
        $('shareBtn').textContent = c.shareBtn || '💌 شارك';

        // الفوتر
        $('footerTitle').textContent = c.footerTitle || '';
        $('footerSub').textContent = c.footerSub || '';

        // الموسيقى
        const src = document.querySelector('#music source');
        if (src && c.musicFile) src.src = c.musicFile;

        // ── بعد تطبيق البيانات، شغّل باقي الكود
        initApp(c);
      })
      .catch(() => { console.error('تعذّر تحميل config.json'); });

    function initApp(config) {
      for (let i = 0; i < 75; i++) { let s = document.createElement('i'); s.className = 'star'; s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'; s.style.animationDelay = Math.random() * 4 + 's'; $('stars').append(s) }

      function petals(n = 1) { for (let i = 0; i < n; i++) { const p = document.createElement('span'); p.className = 'petal'; p.textContent = ['🌸', '✿', '♥', '✦'][Math.floor(Math.random() * 4)]; p.style.left = Math.random() * 100 + '%'; p.style.animationDuration = (6 + Math.random() * 6) + 's'; p.style.fontSize = (12 + Math.random() * 16) + 'px'; $('petals').append(p); setTimeout(() => p.remove(), 12500) } }

      let invitationOpened = false; let petalTimer; const music = $('music');
      function toggleMusic() { if (music.paused) { music.play().then(() => { $('musicBtn').textContent = '♫'; $('musicBtn').classList.add('playing') }).catch(() => { $('musicBtn').textContent = '♪'; $('musicBtn').classList.remove('playing') }) } else { music.pause(); $('musicBtn').textContent = '♪'; $('musicBtn').classList.remove('playing') } }

      function openInvitation() { if (invitationOpened) return; invitationOpened = true; $('openBtn').disabled = true; $('envelope').classList.add('open'); music.play().then(() => $('musicBtn').classList.add('playing')).catch(() => { $('musicBtn').title = 'اضغط لتشغيل الأغنية'; }); setTimeout(() => { $('opening').classList.add('hide'); $('site').classList.add('visible'); fitInvitation(); $('musicBtn').hidden = false; petals(24); petalTimer = setInterval(() => petals(2), 1100); setTimeout(() => observer.observe($('countdown')), 50) }, 1400) }
      $('openBtn').addEventListener('click', openInvitation);
      $('envelope').addEventListener('click', openInvitation);
      $('envelope').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvitation() } });
      $('musicBtn').addEventListener('click', toggleMusic);

      function fitInvitation() { const card = $('invitationCard'), site = $('site'); if (!card || !site) return; site.classList.remove('scroll-layout'); const height = window.innerHeight, width = document.documentElement.clientWidth; const scale = Math.min(1, (height - 88) / card.offsetHeight, (width - 24) / card.offsetWidth); if (scale < .9) { site.classList.add('scroll-layout'); card.style.setProperty('--card-scale', 1); card.style.top = '' } else { card.style.setProperty('--card-scale', scale); card.style.top = ((height - 64) / 2) + 'px' } }
      fitInvitation(); window.addEventListener('resize', fitInvitation); if (window.visualViewport) window.visualViewport.addEventListener('resize', fitInvitation); if (document.fonts) document.fonts.ready.then(fitInvitation); new ResizeObserver(fitInvitation).observe($('invitationCard'));

      const observer = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); observer.unobserve(e.target) } }), { threshold: .12 }); document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

      function updateClock() { const diff = Math.max(0, new Date(config.date).getTime() - Date.now()); const units = [Math.floor(diff / 86400000), Math.floor(diff / 3600000) % 24, Math.floor(diff / 60000) % 60, Math.floor(diff / 1000) % 60];['days', 'hours', 'minutes', 'seconds'].forEach((id, i) => $(id).textContent = String(units[i]).padStart(2, '0')) }
      updateClock(); setInterval(updateClock, 1000);

      $('shareBtn').addEventListener('click', async () => { const data = { title: config.pageTitle || 'دعوة', text: config.coverSubtitle || '', url: location.href }; try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); alert('تم نسخ رابط الدعوة ♥') } } catch (e) { if (e.name !== 'AbortError') alert('يمكنك نسخ رابط الصفحة ومشاركته') } });
    }
  </script>
