<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f0ebf8">
  <title></title>
  <meta name="description" content="">
  <meta property="og:type" content="website">
  
  
  
  
  
  
  
  
  
  
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="stars" id="stars"></div>
  <div class="petals" id="petals"></div>
  <div class="opening" id="opening">
    <div class="intro">
      <div class="eyebrow" id="coverEyebrow"></div>
      <h1 id="coverTitle"><span class="cover-message" id="coverSubtitle"></span></h1>
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="افتح الدعوة" style="cursor:pointer">
        <div class="env-back"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal">♥</div>
      </div><button class="open-btn" id="openBtn"></button>
    </div>
  </div>
  <main class="site" id="site">
    <article class="frame invitation-card" id="invitationCard">
      <div class="ornament">❦</div>
      <p class="sub" id="cardSub"></p>
      <div class="names"><span id="groomName"></span><span class="amp">♥</span><span id="brideName"></span></div>
      <div class="line"></div>
      <p class="message" id="cardMessage"></p>
      <section class="details">
        <h2 class="section-title reveal" id="detailsTitle"></h2>
        <p class="description reveal" id="detailsSubtitle"></p>
        <div class="cards">
          <div class="card reveal">
            <div class="ico">📅</div>
            <h3>التاريخ</h3>
            <p id="dateText"></p>
          </div>
          <div class="card reveal">
            <div class="ico">🕗</div>
            <h3>الموعد</h3>
            <p id="timeText"></p>
          </div>
          <div class="card reveal">
            <div class="ico">📍</div>
            <h3>المكان</h3>
            <p id="venueText"></p>
          </div>
        </div>
        <h2 class="section-title reveal" id="countdownTitle"></h2>
        <div class="countdown reveal" id="countdown">
          <div class="timebox"><strong id="days">00</strong><span>يوم</span></div>
          <div class="timebox"><strong id="hours">00</strong><span>ساعة</span></div>
          <div class="timebox"><strong id="minutes">00</strong><span>دقيقة</span></div>
          <div class="timebox"><strong id="seconds">00</strong><span>ثانية</span></div>
        </div>
        <div class="actions reveal"><a class="action" id="mapLink" href="#" target="_blank" rel="noopener"></a></div>
      </section>
      <footer class="footer">
        <h2 class="reveal" id="footerTitle"></h2>
        <p class="reveal" id="footerSub"></p>
        <div class="actions reveal"><button class="action" id="shareBtn"></button></div>
      </footer>
    </article>
  </main>
  <button class="music" id="musicBtn" title="تشغيل أو إيقاف الموسيقى" aria-label="تشغيل أو إيقاف الموسيقى"
    hidden>♫</button>
  <audio id="music" loop preload="auto">
    <source src="wedding-music.mp3" type="audio/mpeg">
  </audio>
  <script>
    const $ = id => document.getElementById(id);

    // ── تحميل config.json وتطبيق كل القيم
    fetch('config.json')
      .then(r => r.json())
      .then(c => {
        // عنوان الصفحة
        const names = c.groom + ' ♥ ' + c.bride;
        const fullTitle = c.pageTitle || ('دعوة عقد قران ' + names);
        const desc = 'يسعدنا دعوتكم لعقد قران ' + names + '. ' + (c.coverSubtitle || '');
        const shareDesc = (c.coverSubtitle || '') + ' اضغط على الظرف لفتح الدعوة';
        document.title = fullTitle;
        document.querySelector('meta[name="description"]').content = desc;
        document.querySelector('meta[property="og:title"]').content = fullTitle;
        document.querySelector('meta[property="og:description"]').content = shareDesc;
        document.querySelector('meta[property="og:image:alt"]').content = shareDesc;
        document.querySelector('meta[name="twitter:title"]').content = fullTitle;
        document.querySelector('meta[name="twitter:description"]').content = shareDesc;

    // URL والصورة من config
    const su = c.siteUrl || '';
    const img = c.previewImage || '';
    const shareText = (c.coverSubtitle||'') + ' اضغط على الظرف لفتح الدعوة';

    // canonical
    let can = document.querySelector('link[rel="canonical"]');
    if(!can){ can = document.createElement('link'); can.rel='canonical'; document.head.appendChild(can); }
    can.href = su;

    // og:url
    let ogUrl = document.querySelector('meta[property="og:url"]');
    if(!ogUrl){ ogUrl = document.createElement('meta'); ogUrl.setAttribute('property','og:url'); document.head.appendChild(ogUrl); }
    ogUrl.content = su;

    // og:image + secure_url
    ['og:image','og:image:secure_url'].forEach(p=>{
      let m = document.querySelector('meta[property="'+p+'"]');
      if(!m){ m=document.createElement('meta'); m.setAttribute('property',p); document.head.appendChild(m); }
      m.content = img;
    });

    // og:image type/width/height
    [['og:image:type','image/png'],['og:image:width','1200'],['og:image:height','630']].forEach(([p,v])=>{
      let m = document.querySelector('meta[property="'+p+'"]');
      if(!m){ m=document.createElement('meta'); m.setAttribute('property',p); document.head.appendChild(m); }
      m.content = v;
    });

    // og:image:alt
    let imgAlt = document.querySelector('meta[property="og:image:alt"]');
    if(!imgAlt){ imgAlt=document.createElement('meta'); imgAlt.setAttribute('property','og:image:alt'); document.head.appendChild(imgAlt); }
    imgAlt.content = shareText;

    // twitter:image
    let twImg = document.querySelector('meta[name="twitter:image"]');
    if(!twImg){ twImg=document.createElement('meta'); twImg.setAttribute('name','twitter:image'); document.head.appendChild(twImg); }
    twImg.content = img;

    // og:locale
    let locale = document.querySelector('meta[property="og:locale"]');
    if(!locale){ locale=document.createElement('meta'); locale.setAttribute('property','og:locale'); document.head.appendChild(locale); }
    locale.content = 'ar_EG';

        // الشاشة الافتتاحية
        $('coverEyebrow').textContent = c.coverEyebrow || '';
        $('coverSubtitle').textContent = c.coverSubtitle || '';
        const h1 = $('coverTitle');
        h1.childNodes[0]
          ? h1.insertBefore(document.createTextNode(c.groom + ' ♥ ' + c.bride + ' '), h1.firstChild)
          : h1.prepend(c.groom + ' ♥ ' + c.bride + ' ');
        $('openBtn').textContent = c.coverButton || '';
        $('envelope').setAttribute('aria-label', 'افتح دعوة ' + c.groom + ' ♥ ' + c.bride);

        // البطاقة الداخلية
        $('groomName').textContent = c.groom || '';
        $('brideName').textContent = c.bride || '';
        $('cardSub').textContent = c.cardSub || '';
        $('cardMessage').innerHTML = (c.cardMessage || '').replace(/\n/g, '<br>');

        // التفاصيل
        $('detailsTitle').textContent = c.detailsTitle || '';
        $('detailsSubtitle').textContent = c.detailsSubtitle || '';
        $('dateText').textContent = c.dateLabel || '';
        $('timeText').textContent = c.timeLabel || '';
        $('venueText').textContent = c.venue || '';
        $('countdownTitle').textContent = c.countdownTitle || '';

        // الأزرار والروابط
        $('mapLink').textContent = c.mapBtn || '📍 الموقع';
        $('mapLink').href = c.mapUrl || '#';
        $('shareBtn').textContent = c.shareBtn || '💌 شارك';

        // الفوتر
        $('footerTitle').textContent = c.footerTitle || '';
        $('footerSub').textContent = c.footerSub || '';

        // الموسيقى
        const src = document.querySelector('#music source');
        if (src && c.musicFile) src.src = c.musicFile;

        // ── بعد تطبيق البيانات، شغّل باقي الكود
        initApp(c);
      })
      .catch(() => { console.error('تعذّر تحميل config.json'); });

    function initApp(config) {
      for (let i = 0; i < 75; i++) { let s = document.createElement('i'); s.className = 'star'; s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'; s.style.animationDelay = Math.random() * 4 + 's'; $('stars').append(s) }

      function petals(n = 1) { for (let i = 0; i < n; i++) { const p = document.createElement('span'); p.className = 'petal'; p.textContent = ['🌸', '✿', '♥', '✦'][Math.floor(Math.random() * 4)]; p.style.left = Math.random() * 100 + '%'; p.style.animationDuration = (6 + Math.random() * 6) + 's'; p.style.fontSize = (12 + Math.random() * 16) + 'px'; $('petals').append(p); setTimeout(() => p.remove(), 12500) } }

      let invitationOpened = false; let petalTimer; const music = $('music');
      function toggleMusic() { if (music.paused) { music.play().then(() => { $('musicBtn').textContent = '♫'; $('musicBtn').classList.add('playing') }).catch(() => { $('musicBtn').textContent = '♪'; $('musicBtn').classList.remove('playing') }) } else { music.pause(); $('musicBtn').textContent = '♪'; $('musicBtn').classList.remove('playing') } }

      function openInvitation() { if (invitationOpened) return; invitationOpened = true; $('openBtn').disabled = true; $('envelope').classList.add('open'); music.play().then(() => $('musicBtn').classList.add('playing')).catch(() => { $('musicBtn').title = 'اضغط لتشغيل الأغنية'; }); setTimeout(() => { $('opening').classList.add('hide'); $('site').classList.add('visible'); fitInvitation(); $('musicBtn').hidden = false; petals(24); petalTimer = setInterval(() => petals(2), 1100); setTimeout(() => observer.observe($('countdown')), 50) }, 1400) }
      $('openBtn').addEventListener('click', openInvitation);
      $('envelope').addEventListener('click', openInvitation);
      $('envelope').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvitation() } });
      $('musicBtn').addEventListener('click', toggleMusic);

      function fitInvitation() { const card = $('invitationCard'), site = $('site'); if (!card || !site) return; site.classList.remove('scroll-layout'); const height = window.innerHeight, width = document.documentElement.clientWidth; const scale = Math.min(1, (height - 88) / card.offsetHeight, (width - 24) / card.offsetWidth); if (scale < .9) { site.classList.add('scroll-layout'); card.style.setProperty('--card-scale', 1); card.style.top = '' } else { card.style.setProperty('--card-scale', scale); card.style.top = ((height - 64) / 2) + 'px' } }
      fitInvitation(); window.addEventListener('resize', fitInvitation); if (window.visualViewport) window.visualViewport.addEventListener('resize', fitInvitation); if (document.fonts) document.fonts.ready.then(fitInvitation); new ResizeObserver(fitInvitation).observe($('invitationCard'));

      const observer = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); observer.unobserve(e.target) } }), { threshold: .12 }); document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

      function updateClock() { const diff = Math.max(0, new Date(config.date).getTime() - Date.now()); const units = [Math.floor(diff / 86400000), Math.floor(diff / 3600000) % 24, Math.floor(diff / 60000) % 60, Math.floor(diff / 1000) % 60];['days', 'hours', 'minutes', 'seconds'].forEach((id, i) => $(id).textContent = String(units[i]).padStart(2, '0')) }
      updateClock(); setInterval(updateClock, 1000);

      $('shareBtn').addEventListener('click', async () => { const data = { title: config.pageTitle || 'دعوة', text: config.coverSubtitle || '', url: location.href }; try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); alert('تم نسخ رابط الدعوة ♥') } } catch (e) { if (e.name !== 'AbortError') alert('يمكنك نسخ رابط الصفحة ومشاركته') } });
    }
  </script>
</body>

</html>
